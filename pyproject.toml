[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dictate"
version = "0.1.0"
description = "Local-first voice dictation client for whisper.cpp"
requires-python = ">=3.13"
dependencies = [
    "sounddevice>=0.4.6",
    "httpx>=0.27.0",
    "numpy>=1.26",
    "dbus-next>=0.2.3",
]

[project.scripts]
dictate = "dictate.service:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
